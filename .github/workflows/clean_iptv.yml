name: Nettoyage IPTV Automatique

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  clean-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Télécharger et nettoyer la liste
        run: |
          # Téléchargement via le miroir jsDelivr pour éviter l'erreur réseau (exit code 6)
          curl -L -s "https://jsdelivr.net" > raw_list.m3u

          # Si le miroir échoue, tentative avec une commande de secours
          if [ ! -s raw_list.m3u ]; then
            curl -L -s "https://githubusercontent.com" > raw_list.m3u
          fi

          # Suppression stricte de toutes les lignes contenant EXTVLCOPT
          sed '/#EXTVLCOPT/d' raw_list.m3u > playlist_propre.m3u

          # Nettoyage du fichier temporaire
          rm raw_list.m3u
          
          

      
    

