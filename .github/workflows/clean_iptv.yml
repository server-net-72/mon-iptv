name: Auto Clean IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et nettoyer les listes
        run: |
          cat << 'EOF' > nettoyer.py
          import urllib.request
          import os

          # Vos 4 playlists initiales (Modèle exact et vérifié)
          PLAYLISTS = {
              "playlist_france.m3u": "https://iptv-org.github.io/iptv/countries/fr.m3u",
              "playlist_pluto_fr.m3u": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
              "playlist_tvradiozap.m3u": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
              "playlist_usa.m3u": "https://iptv-org.github.io/iptv/countries/us.m3u"
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Traitement de vos 4 playlists de base
          for nom_fichier, url in PLAYLISTS.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as reponse, open(nom_fichier, 'w', encoding='utf-8') as f_propre:
                      for l_octets in reponse:
                          ligne = l_octets.decode('utf-8', errors='ignore')
                          if "#EXTVLCOPT" not in ligne:
                              f_propre.write(ligne)
              except Exception as e:
                  with open(nom_fichier, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur de téléchargement\n")

          # 2. Filtrage global de l'index géant (Lien exact iptv-org.github.io)
          url_geante = "https://iptv-org.github.io/iptv/index.m3u"
          print("Téléchargement de l'index mondial...")
          
          autorises = [
              "france", "united states", "usa", "canada", "spain", "italy", "germany", "india",
              "arabic", "arab", "morocco", "algeria", "tunisia", "egypt", "saudi", "uae", "lebanon", "jordan",
              "movies", "music", "sports", "animation", "comedy", "documentary", "entertainment", "films", "cinema"
          ]

          try:
              req_geante = urllib.request.Request(url_geante, headers=headers)
              with urllib.request.urlopen(req_geante, timeout=60) as reponse:
                  lignes_index = [l.decode('utf-8', errors='ignore') for l in reponse]

              # Extraction de TOUTES les chaînes valides dans une liste temporaire
              toutes_chaines = []
              tampon_extinf = ""
              
              for ligne in lignes_index:
                  if ligne.startswith("#EXTINF:"):
                      tampon_extinf = ligne
                  elif ligne.strip() and not ligne.startswith("#"):
                      if tampon_extinf and "#EXTVLCOPT" not in tampon_extinf:
                          if any(critere in tampon_extinf.lower() for critere in autorises):
                              # On stocke le bloc complet (la ligne #EXTINF + la ligne du lien)
                              toutes_chaines.append((tampon_extinf, ligne))
                      tampon_extinf = ""

              total_chaines = len(toutes_chaines)
              milieu = total_chaines // 2
              print(f"Nombre total de chaînes trouvées : {total_chaines}. Coupe au milieu à : {milieu}")

              # Écriture de la première moitié (Fichier Pays)
              with open("playlist_selection_pays.m3u", 'w', encoding='utf-8') as f_pays:
                  f_pays.write("#EXTM3U\n")
                  for extinf, lien in toutes_chaines[:milieu]:
                      f_pays.write(extinf)
                      f_pays.write(lien)

              # Écriture de la seconde moitié (Fichier Divertissement)
              with open("playlist_selection_divertissement.m3u", 'w', encoding='utf-8') as f_div:
                  f_div.write("#EXTM3U\n")
                  for extinf, lien in toutes_chaines[milieu:]:
                      f_div.write(extinf)
                      f_div.write(lien)

              print("Succès : Les deux fichiers ont été divisés à parts égales.")
          except Exception as e:
              print(f"Erreur lors du traitement : {e}")
              for f_nom in ["playlist_selection_pays.m3u", "playlist_selection_divertissement.m3u"]:
                  with open(f_nom, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur\n")

          EOF
          python3 nettoyer.py
          rm nettoyer.py

      - name: Sauvegarder et publier les playlists nettoyées
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist_france.m3u
          git add playlist_pluto_fr.m3u
          git add playlist_tvradiozap.m3u
          git add playlist_usa.m3u
          git add playlist_selection_divertissement.m3u
          git add playlist_selection_pays.m3u
          
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans les playlists."
          else
            git commit -m "Decoupage mathematique strict en 2 fichiers egaux"
            git push
          fi
