import requests

# Configuration stricte de vos 5 listes de base fonctionnelles
PLAYLIST_SOURCES = {
    "France": "https://iptv-org.github.io/iptv/countries/fr.m3u",
    "Pluto_FR": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
    "TVRadioZap": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
    "USA": "https://iptv-org.github.io/iptv/countries/us.m3u",
    "Arabe": "https://iptv-org.github.io/iptv/languages/ara.m3u"
}

def clean_playlist(raw_text):
    """Nettoie la playlist en supprimant strictement les doublons d'URL."""
    lines = raw_text.splitlines()
    cleaned_lines = ["#EXTM3U"]
    seen_urls = set()
    
    i = 1
    while i < len(lines):
        line = lines[i].strip()
        if line.startswith("#EXTINF"):
            info_line = line
            url_line = ""
            
            # Récupération de la ligne d'URL suivante
            if i + 1 < len(lines):
                url_line = lines[i+1].strip()
            
            if url_line and not url_line.startswith("#"):
                # Vérification du dédoublonnage pour OttPlayer
                if url_line not in seen_urls:
                    cleaned_lines.append(info_line)
                    cleaned_lines.append(url_line)
                    seen_urls.add(url_line)
                    
            i += 2
        else:
            i += 1
            
    return "\n".join(cleaned_lines)

def main():
    for name, url in PLAYLIST_SOURCES.items():
        # Ignorer les listes si vous n'avez pas encore remplacé les textes d'exemple par vos vraies URL
        if "URL_DE_VOTRE_LISTE" in url:
            print(f"Saut de {name} : Veuillez configurer sa véritable URL source.")
            continue
            
        try:
            print(f"Téléchargement et nettoyage de : {name}...")
            response = requests.get(url, timeout=15)
            response.raise_for_status()
            
            # Application du nettoyage par dédoublonnage
            result = clean_playlist(response.text)
                
            # Sauvegarde locale du fichier nettoyé
            filename = f"{name.lower()}_clean.m3u8"
            with open(filename, "w", encoding="utf-8") as f:
                f.write(result)
            print(f"Fichier {filename} généré avec succès.")
            
        except Exception as e:
            print(f"Erreur lors du traitement de {name}: {e}")

if __name__ == "__main__":
    main()
