name: Auto Clean IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et nettoyer les listes
        run: |
          cat << 'EOF' > nettoyer.py
          import urllib.request
          import os

          # CONFIGURATION DE VOS PLAYLISTS
          # REMPLACEZ LES QUATRE PREMIERS LIENS PAR VOS URLS EXACTES ET VÉRIFIÉES
          PLAYLISTS = {
              "playlist_france.m3u": "https://iptv-org.github.io/iptv/countries/fr.m3u",
              "playlist_pluto_fr.m3u": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
              "playlist_tvradiozap.m3u": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
              "playlist_usa.m3u": "https://iptv-org.github.io/iptv/countries/us.m3u"
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Nettoyage standard de vos 4 premières listes
          for nom_fichier, url in PLAYLISTS.items():
              if "METTEZ_ICI" in url:
                  print(f"Saut de {nom_fichier} : URL non configurée par l'utilisateur.")
                  continue
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as reponse, open(nom_fichier, 'w', encoding='utf-8') as f_propre:
                      for l_octets in reponse:
                          ligne = l_octets.decode('utf-8', errors='ignore')
                          if "#EXTVLCOPT" not in ligne:
                              f_propre.write(ligne)
                  print(f"Succès : {nom_fichier} a été mise à jour.")
              except Exception as e:
                  with open(nom_fichier, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur de téléchargement\n")

          # 2. Traitement et filtrage strict de la nouvelle liste internationale (Votre URL exacte)
          url_international = "https://iptv-org.github.io/iptv/countries/int.m3u"
          print("Début du nettoyage de la playlist internationale...")
          
          # Mots-clés interdits (News et Radios)
          mots_bannis = ["news", "info", "actu", "journal", "radio", "press"]

          try:
              req_int = urllib.request.Request(url_international, headers=headers)
              with urllib.request.urlopen(req_int, timeout=45) as reponse, open("playlist_international.m3u", 'w', encoding='utf-8') as f_int:
                  f_int.write("#EXTM3U\n")
                  
                  urls_uniques = set()
                  tampon_extinf = ""
                  compteur = 0
                  
                  for l_octets in reponse:
                      ligne = l_octets.decode('utf-8', errors='ignore')
                      
                      if ligne.startswith("#EXTINF:"):
                          tampon_extinf = ligne
                      elif ligne.strip() and not ligne.startswith("#"):
                          url_flux = ligne.strip()
                          if tampon_extinf and "#EXTVLCOPT" not in tampon_extinf:
                              # On élimine les doublons de liens
                              if url_flux not in urls_uniques:
                                  texte_l = tampon_extinf.lower()
                                  # Filtre strict : Aucun mot banni ne doit être dans le titre
                                  if not any(banni in texte_l for banni in mots_bannis):
                                      f_int.write(tampon_extinf)
                                      f_int.write(ligne)
                                      urls_uniques.add(url_flux)
                                      compteur += 1
                          tampon_extinf = ""
              print(f"Succès : 'playlist_international.m3u' créée avec {compteur} chaînes épurées.")
          except Exception as e:
              print(f"Erreur internationale : {e}")
              with open("playlist_international.m3u", 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n# Erreur de traitement international\n")

          EOF
          python3 nettoyer.py
          rm nettoyer.py

      - name: Sauvegarder et publier les playlists nettoyées
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist_france.m3u
          git add playlist_pluto_fr.m3u
          git add playlist_tvradiozap.m3u
          git add playlist_usa.m3u
          git add playlist_international.m3u
          
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans les playlists."
          else
            git commit -m "Ajout de la playlist internationale filtree sans news ni radios"
            git push
          fi
