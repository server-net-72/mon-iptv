name: Auto Clean IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et nettoyer les listes
        run: |
          cat << 'EOF' > nettoyer.py
          import urllib.request
          import os

          # Vos 4 playlists initiales (Liens complets exacts)
          PLAYLISTS = {
              "playlist_france.m3u": "https://iptv-org.github.io/iptv/countries/fr.m3u",
              "playlist_pluto_fr.m3u": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
              "playlist_tvradiozap.m3u": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
              "playlist_usa.m3u": "https://iptv-org.github.io/iptv/countries/us.m3u"
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Traitement des 4 premières playlists normales
          for nom_fichier, url in PLAYLISTS.items():
              print(f"Début du traitement de : {nom_fichier}")
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as reponse, open(nom_fichier, 'w', encoding='utf-8') as fichier_propre:
                      for ligne_octets in reponse:
                          ligne = ligne_octets.decode('utf-8', errors='ignore')
                          if "#EXTVLCOPT" not in ligne:
                              fichier_propre.write(ligne)
                  print(f"Succès : {nom_fichier} a été créée.")
              except Exception as e:
                  print(f"Erreur sur {nom_fichier} : {e}")
                  with open(nom_fichier, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur de téléchargement\n")

          # 2. Traitement massif et intelligent de la liste géante Free-TV
          url_freetv = "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
          print("Début de l'extraction massive de la liste géante Free-TV...")
          try:
              req_free = urllib.request.Request(url_freetv, headers=headers)
              with urllib.request.urlopen(req_free, timeout=45) as reponse, open("playlist_freetv_selection.m3u", 'w', encoding='utf-8') as fichier_selection:
                  
                  fichier_selection.write("#EXTM3U\n")
                  tampon_extinf = ""
                  
                  # Liste d'exclusions des groupes ou pays dont vous n'avez pas besoin
                  # Le robot élimine uniquement cela et GARDE TOUT LE RESTE (Cinéma, Sport, Arab, India, USA, France, etc.)
                  pays_exclus = [
                      "russia", "russian", "ukraine", "ukrainian", "china", "chinese", 
                      "taiwan", "turkey", "turkish", "korea", "korean", "japan", "japanese",
                      "vietnam", "indonesia", "thailand", "poland", "polish", "romania"
                  ]
                  
                  for ligne_octets in reponse:
                      ligne = ligne_octets.decode('utf-8', errors='ignore')
                      
                      if ligne.startswith("#EXTINF:"):
                          tampon_extinf = ligne
                      elif ligne.strip() and not ligne.startswith("#"):
                          if tampon_extinf and "#EXTVLCOPT" not in tampon_extinf:
                              # Stratégie inversée : On garde SAUF si le groupe fait partie des pays exclus
                              if not any(pays in tampon_extinf.lower() for pays in pays_exclus):
                                  fichier_selection.write(tampon_extinf)
                                  fichier_selection.write(ligne)
                          tampon_extinf = ""
                          
              print("Succès : La playlist géante filtrée Free-TV a été créée.")
          except Exception as e:
              print(f"Erreur sur Free-TV : {e}")
              with open("playlist_freetv_selection.m3u", 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n# Erreur de téléchargement Free-TV\n")

          EOF
          python3 nettoyer.py
          rm nettoyer.py

      - name: Sauvegarder et publier les playlists nettoyées
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist_france.m3u
          git add playlist_pluto_fr.m3u
          git add playlist_tvradiozap.m3u
          git add playlist_usa.m3u
          git add playlist_freetv_selection.m3u
          
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans les playlists."
          else
            git commit -m "Mise à jour des 4 playlists + Large Sélection Free-TV"
            git push
          fi
