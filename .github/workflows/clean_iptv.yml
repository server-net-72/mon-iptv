name: Auto Clean IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et nettoyer les listes
        run: |
          cat << 'EOF' > nettoyer.py
          import urllib.request
          import os

          # Vos 4 playlists initiales (Liens complets exacts et fonctionnels)
          PLAYLISTS = {
              "playlist_france.m3u": "https://iptv-org.github.io/iptv/countries/fr.m3u",
              "playlist_pluto_fr.m3u": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
              "playlist_tvradiozap.m3u": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
              "playlist_usa.m3u": "https://iptv-org.github.io/iptv/countries/us.m3u"
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Traitement des 4 premières playlists normales
          for nom_fichier, url in PLAYLISTS.items():
              print(f"Début du traitement de : {nom_fichier}")
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as reponse, open(nom_fichier, 'w', encoding='utf-8') as fichier_propre:
                      for ligne_octets in reponse:
                          ligne = ligne_octets.decode('utf-8', errors='ignore')
                          if "#EXTVLCOPT" not in ligne:
                              fichier_propre.write(ligne)
                  print(f"Succès : {nom_fichier} a été créée.")
              except Exception as e:
                  print(f"Erreur sur {nom_fichier} : {e}")
                  with open(nom_fichier, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur de téléchargement\n")

          # 2. Traitement et découpage intelligent de l'INDEX MONDIAL GÉANT
          url_geante = "https://iptv-org.github.io/iptv/index.m3u"
          print("Début du téléchargement et du découpage de l'index mondial...")
          
          criteres_thematiques = ["movies", "music", "sports", "animation", "comedy", "documentary", "entertainment", "films"]
          criteres_pays = ["france", "united states", "usa", "canada", "spain", "italy", "germany", "india", "arabic", "arab", "morocco", "algeria", "tunisia", "egypt", "saudi", "uae", "lebanon", "jordan"]

          try:
              req_geante = urllib.request.Request(url_geante, headers=headers)
              with urllib.request.urlopen(req_geante, timeout=60) as reponse:
                  # Lecture complète des lignes en mémoire pour le découpage
                  lignes_index = [l.decode('utf-8', errors='ignore') for l in reponse]

              # Ouverture des deux fichiers de destination
              with open("playlist_selection_divertissement.m3u", 'w', encoding='utf-8') as f_div, open("playlist_selection_pays.m3u", 'w', encoding='utf-8') as f_pays:
                  f_div.write("#EXTM3U\n")
                  f_pays.write("#EXTM3U\n")
                  
                  tampon_extinf = ""
                  
                  for ligne in lignes_index:
                      if ligne.startswith("#EXTINF:"):
                          tampon_extinf = ligne
                      elif ligne.strip() and not ligne.startswith("#"):
                          if tampon_extinf and "#EXTVLCOPT" not in tampon_extinf:
                              texte_analyse = tampon_extinf.lower()
                              
                              # Fichier 1 : Divertissement mondial
                              if any(critere in texte_analyse for critere in criteres_thematiques):
                                  f_div.write(tampon_extinf)
                                  f_div.write(ligne)
                              
                              # Fichier 2 : Pays et cultures cibles
                              elif any(critere in texte_analyse for critere in criteres_pays):
                                  f_pays.write(tampon_extinf)
                                  f_pays.write(ligne)
                                  
                          tampon_extinf = ""
                          
              print("Succès : Les deux playlists découpées ont été générées.")
          except Exception as e:
              print(f"Erreur lors du découpage de l'index : {e}")
              for f_nom in ["playlist_selection_divertissement.m3u", "playlist_selection_pays.m3u"]:
                  with open(f_nom, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur de traitement\n")

          EOF
          python3 nettoyer.py
          rm nettoyer.py

      - name: Sauvegarder et publier les playlists nettoyées
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Enregistrement des 4 listes de base + des 2 nouvelles listes découpées
          git add playlist_france.m3u
          git add playlist_pluto_fr.m3u
          git add playlist_tvradiozap.m3u
          git add playlist_usa.m3u
          git add playlist_selection_divertissement.m3u
          git add playlist_selection_pays.m3u
          
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans les playlists."
          else
            git commit -m "Découpage de l'index mondial en deux sous-listes"
            git push
          fi
