name: Auto Clean IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et nettoyer les listes
        run: |
          cat << 'EOF' > nettoyer.py
          import urllib.request
          import os

          # CONFIGURATION DE VOS PLAYLISTS INITIALES
          PLAYLISTS = {
              "playlist_france.m3u": "https://iptv-org.github.io/iptv/countries/fr.m3u",
              "playlist_pluto_fr.m3u": "https://iptv-org.github.io/iptv/sources/fr_pluto.m3u",
              "playlist_tvradiozap.m3u": "https://tvradiozap.eu/live/x/vlc/d/tvzeu.m3u",
              "playlist_usa.m3u": "https://iptv-org.github.io/iptv/countries/us.m3u"
          }

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Nettoyage de vos 4 premières listes
          for nom_fichier, url in PLAYLISTS.items():
              if "METTEZ_ICI" in url:
                  continue
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as reponse, open(nom_fichier, 'w', encoding='utf-8') as f_propre:
                      for l_octets in reponse:
                          ligne = l_octets.decode('utf-8', errors='ignore')
                          if "#EXTVLCOPT" not in ligne:
                              f_propre.write(ligne)
              except Exception as e:
                  with open(nom_fichier, 'w', encoding='utf-8') as f:
                      f.write("#EXTM3U\n# Erreur\n")

          # 2. Filtrage chirurgical de la playlist internationale
          url_international = "https://iptv-org.github.io/iptv/countries/int.m3u"
          print("Filtrage profond de la liste internationale...")
          
          # Liste noire étendue (Radios, News, et Religions non-islamiques)
          mots_bannis = ["news", "info", "actu", "journal", "radio", "press", "church", "christian", "bible", "god", "gospel", "buddha", "hindu"]
          mots_islam = ["islam", "quran", "koran", "sunnah", "makkah", "madinah"]

          try:
              req_int = urllib.request.Request(url_international, headers=headers)
              with urllib.request.urlopen(req_int, timeout=45) as reponse:
                  lignes_brutes = [l.decode('utf-8', errors='ignore') for l in reponse]

              with open("playlist_international.m3u", 'w', encoding='utf-8') as f_int:
                  f_int.write("#EXTM3U\n")
                  
                  noms_uniques = set()
                  urls_uniques = set()
                  tampon_extinf = ""
                  compteur = 0
                  
                  for ligne in lignes_brutes:
                      if ligne.startswith("#EXTINF:"):
                          tampon_extinf = ligne
                      elif ligne.strip() and not ligne.startswith("#"):
                          url_flux = ligne.strip()
                          if tampon_extinf and "#EXTVLCOPT" not in tampon_extinf:
                              texte_l = tampon_extinf.lower()
                              
                              # Extraction grossière du nom de la chaîne pour éviter les doublons textuels
                              nom_chaine = texte_l.split(",")[-1].strip() if "," in texte_l else texte_l
                              
                              # On vérifie les doublons d'URL et de Nom
                              if url_flux not in urls_uniques and nom_chaine not in noms_uniques:
                                  
                                  # RÈGLE RELIGIEUSE : Si c'est de l'Islam, on valide directement sans passer par les exclusions
                                  if any(m_is in texte_l for m_is in mots_islam):
                                      f_int.write(tampon_extinf)
                                      f_int.write(ligne)
                                      urls_uniques.add(url_flux)
                                      noms_uniques.add(nom_chaine)
                                      compteur += 1
                                  
                                  # RÈGLE GÉNÉRALE : On garde si aucun mot banni n'est présent
                                  elif not any(banni in texte_l for banni in mots_bannis):
                                      f_int.write(tampon_extinf)
                                      f_int.write(ligne)
                                      urls_uniques.add(url_flux)
                                      noms_uniques.add(nom_chaine)
                                      compteur += 1
                                      
                          tampon_extinf = ""
              print(f"Succès : Playlist filtrée avec {compteur} chaînes uniques et épurées.")
          except Exception as e:
              print(f"Erreur internationale : {e}")
              with open("playlist_international.m3u", 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n# Erreur de traitement\n")

          EOF
          python3 nettoyer.py
          rm nettoyer.py

      - name: Sauvegarder et publier les playlists nettoyées
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist_france.m3u
          git add playlist_pluto_fr.m3u
          git add playlist_tvradiozap.m3u
          git add playlist_usa.m3u
          git add playlist_international.m3u
          
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans les playlists."
          else
            git commit -m "Nettoyage en profondeur doublons, news, radios et religions"
            git push
          fi
